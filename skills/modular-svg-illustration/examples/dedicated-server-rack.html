<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Front-panel carousel</title>
  <style>
    :root {
      --color-background: oklch(0.99 0.002 260);
      --color-card: oklch(1 0 0);
      --color-foreground: oklch(0.2 0.02 260);
      --color-border: oklch(0.9 0.01 260);
      --color-primary: oklch(0.55 0.18 255);
      --color-muted: oklch(0.96 0.01 260);
    }
  </style>
  <link rel="stylesheet" href="shared-demo-styles.css" />
</head>
<body class="demo-rack">
  <div class="demo-viewport demo-viewport--rack" id="dedicated-viewport">
    <div class="rack-stage">
      <div class="rack-grid" aria-hidden="true"></div>
      <div class="rack-tick" style="top:calc(50% - 84px)" aria-hidden="true"></div>
      <div class="rack-tick" style="top:calc(50% - 60px)" aria-hidden="true"></div>
      <div class="rack-tick" style="top:calc(50% - 12px)" aria-hidden="true"></div>
      <div class="rack-tick" style="top:calc(50% + 84px)" aria-hidden="true"></div>
      <div class="rack-stack" id="rack-stack"></div>
    </div>
  </div>
  <script src="dedicated-panel.js"></script>
  <script>
    initDedicatedRackDemo("rack-stack", "dedicated-viewport", { cycleMs: 3000 })
  </script>
</body>
</html>
