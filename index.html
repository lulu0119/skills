<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Light-line isometric SVG illustration — examples</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: oklch(0.98 0.005 260);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    iframe {
      display: block;
      border: 1px solid oklch(0.9 0.01 260);
      border-radius: 8px;
      background: oklch(0.99 0.002 260);
      overflow: hidden;
    }
    #frame-overview { width: 640px; height: 200px; }
    #frame-rack { width: 421px; height: 200px; }
  </style>
</head>
<body>
  <iframe id="frame-overview" src="examples/overview-datacenter.html" title="spatial-isometric-scene" scrolling="no"></iframe>
  <iframe id="frame-rack" src="examples/dedicated-server-rack.html" title="front-panel-carousel" scrolling="no"></iframe>
</body>
</html>
