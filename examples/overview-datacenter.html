<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spatial isometric scene</title>
  <style>
    :root {
      --color-background: oklch(0.99 0.002 260);
      --color-card: oklch(1 0 0);
      --color-foreground: oklch(0.2 0.02 260);
      --color-border: oklch(0.9 0.01 260);
      --color-primary: oklch(0.55 0.18 255);
      --color-muted: oklch(0.96 0.01 260);
    }
  </style>
  <link rel="stylesheet" href="shared-demo-styles.css" />
</head>
<body class="demo-overview">
  <div class="demo-viewport demo-viewport--overview">
    <svg id="overview-scene" viewBox="0 0 320 100" class="iso-scene" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  </div>
  <script src="overview-scene.js"></script>
  <script>
    document.getElementById("overview-scene").innerHTML = renderOverviewScene()
  </script>
</body>
</html>
